name: Filter and Save CHC Channels

on:
  # 允许手动触发工作流
  workflow_dispatch:
  # 可设置为定时触发，例如每天北京时间8点运行
  schedule:
     - cron: '0 22 * * *'

# 设置仓库写入权限（关键部分）
permissions:
  contents: write

jobs:
  filter-channels:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码，以便后续提交文件
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 从远程URL下载原始文件
      - name: Download source file
        run: |
          curl -L -o source.txt \
          https://raw.githubusercontent.com/alantang1977/JunTV/refs/heads/main/output/result.txt

      # 3. 核心：筛选包含指定频道名称的行
      #    注意：此处的grep命令假设result.txt每行是一个频道信息。
      #    如果格式不同（如JSON、M3U等），需要替换为对应的解析逻辑。
      - name: Filter channels
        run: |
          grep -E "CHC家庭影院|CHC动作电影" source.txt > CHC.txt || true
          # 使用 '|| true' 是为了防止没有匹配项时命令失败导致工作流停止

      # 4. 检查并提交更改（如果CHC.txt存在且不为空）
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查文件是否存在且非空
          if [ -s CHC.txt ]; then
            git add CHC.txt
            # 如果文件有变更或新文件，则提交
            git commit -m "Update CHC.txt with filtered channels [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "No CHC channels found, skipping commit."
          fi
